# Answers for the disk installer ("Install" in the boot menu).
# The installer still asks for disk, timezone and the cunnit user's password.
d-i netcfg/get_hostname string cunnit
d-i netcfg/get_domain string
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Cunnit Admin
d-i passwd/username string cunnit
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev sudo docker
