#!/usr/sbin/nft -f
# Cunnit host firewall: drop incoming traffic except the ports below.
# It only touches its own table, so Docker's and k3s's rules are left alone.

table inet cunnit
delete table inet cunnit

table inet cunnit {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport { 68, 546 } accept

    # Containers and pods talking to the host
    iifname "docker0" accept
    iifname "br-*" accept
    iifname "cni0" accept
    iifname "flannel.1" accept

    # SSH, web, Kubernetes API, Kubernetes NodePorts
    tcp dport { 22, 80, 443, 6443 } accept
    tcp dport 30000-32767 accept
  }
}
